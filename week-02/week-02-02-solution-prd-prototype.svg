      .small{font-family:Helvetica,Arial,sans-serif;font-size:18px;fill:#334155}
      .tiny{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#475569}
      .card{fill:#fff;stroke:#d6dee6;stroke-width:2;filter:url(#shadow)}
      .arrow{stroke:#003057;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none;marker-end:url(#arrowHead)}
    </style>
